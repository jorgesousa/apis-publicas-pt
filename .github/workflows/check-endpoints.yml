name: Verificar endpoints

on:
  schedule:
    - cron: "17 6 * * 1"   # segundas, 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/check-endpoints.sh"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar fontes do catálogo
        run: |
          set +e
          ./scripts/check-endpoints.sh --markdown > result.md
          status=$?
          {
            echo "## Estado das fontes ($(date -u +%Y-%m-%d))"
            echo
            cat result.md
          } >> "$GITHUB_STEP_SUMMARY"
          cat result.md
          exit $status
